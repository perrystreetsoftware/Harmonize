name: Tests

on: 
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

jobs:
  macos:
    strategy:
      matrix:
        runner: ['macos-26', 'xcode-27']
    name: MacOS
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Run MacOS Tests
        run: swift test

  ios:
    name: iOS
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Run iOS Tests
        run: |
          xcodebuild test \
            -scheme Harmonize-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug
