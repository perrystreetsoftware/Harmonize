name: Tests

on: 
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

jobs:
  macos:
    strategy:
      matrix:
        runner: ['macos-26', 'xcode-27']
    name: MacOS
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Run MacOS Tests
        run: swift test

  swift-syntax:
    strategy:
      matrix:
        swift-syntax: ['601.0.1', '602.0.0', '603.0.2', '604.0.0']
    name: swift-syntax ${{ matrix.swift-syntax }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve swift-syntax ${{ matrix.swift-syntax }}
        run: swift package resolve swift-syntax --version ${{ matrix.swift-syntax }}

      - name: Build
        run: swift build --build-tests

      - name: Run MacOS Tests
        run: swift test --skip-build

  ios:
    name: iOS
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Run iOS Tests
        run: |
          xcodebuild test \
            -scheme Harmonize-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug
